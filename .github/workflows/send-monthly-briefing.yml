# 자동 발송(cron) 비활성화됨 — 월간 메일은 Actions에서 Run workflow 로만 실행.
# (이전) 매주 금 KST 09:00 cron 제거. 스크립트는 여전히 "해당 월 마지막 금요일"일 때만 발송.
# 수동 실행 시 inputs으로 target_year, target_month 지정 가능 → 해당 월 daily 누적분 전체 사용
# 필수 Secrets: GMAIL_APP_PASSWORD, GMAIL_SENDER, GMAIL_TO
# .monthly_archives/ 사용. 아카이브에 origin_company(출신 회사) 포함 시 "A 출신 B가 C 대표로 선임" 형식으로 표기

name: Send Monthly Briefing

on:
  workflow_dispatch:
    inputs:
      target_year:
        description: '대상 연도 (해당 월 아카이브 캐시 복원용, 미입력 시 현재 연도)'
        required: false
        type: string
      target_month:
        description: '대상 월 1-12 (미입력 시 현재 월)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monthly-briefing:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_TO: ${{ secrets.GMAIL_TO }}
      FORCE_SEND_MONTHLY: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      TARGET_YEAR: ${{ inputs.target_year }}
      TARGET_MONTH: ${{ inputs.target_month }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set target year-month (스크립트용)
        run: |
          if [ -n "${{ inputs.target_year }}" ] && [ -n "${{ inputs.target_month }}" ]; then
            ym=$(python3 -c "print('${{ inputs.target_year }}-'+'${{ inputs.target_month }}'.zfill(2))")
          else
            ym=$(TZ=Asia/Seoul date +%Y-%m)
          fi
          echo "YM=$ym" >> $GITHUB_ENV
          echo "Target month archive: $ym (from repo .monthly_archives/)"

      - name: Send monthly digest (last Friday only)
        run: python send_monthly_digest.py
