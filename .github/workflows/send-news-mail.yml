# 자동 발송(cron) 비활성화됨 — 필요 시 Actions에서 "Run workflow"로만 실행.
# (이전) 평일 KST 10:05/13:05/16:05/19:05 cron 은 제거됨.
# 발송 규칙: ① 이전 발송된 모든 메일 내용과 중복 제거 ② 직전 슬롯 이후 발표된 기사만 수집
# 필수 Secrets: GMAIL_APP_PASSWORD, NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, OPENAI_API_KEY
#
# 파이프라인: send_exec_news_timed → news_raw → summarize_exec_news_llm → news_summary → send_email_from_json → archive_monthly_items
# 제목/요약 규칙: 인사 발생 회사(C) 기준 제목 "C, 임원인사 진행", 타사 출신 선임 시 "A 출신 B 사장이 C 대표로 선임" 형식 (company=선임된 회사, previous_company=출신 회사)

name: Send News Mail

on:
  # 수동만: Actions → Send News Mail → Run workflow
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_TO: ${{ secrets.GMAIL_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv

      - name: Restore sent_dedup_store (이전 메일 중복 제거용)
        uses: actions/cache@v4
        with:
          path: .cache_dedup
          key: sent-dedup-store-v1

      - name: Apply restored sent_dedup_store
        run: |
          mkdir -p .cache_dedup
          [ -f .cache_dedup/sent_dedup_store.json ] && cp .cache_dedup/sent_dedup_store.json . || true

      - name: Collect news (Naver API)
        run: python send_exec_news_timed.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TZ: Asia/Seoul
          FETCH_ARTICLE_BODY: "1"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REQUEST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'today' || 'scheduled' }}

      - name: Summarize with LLM (company=선임된 회사, previous_company=출신 회사 반영)
        run: python summarize_exec_news_llm.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OPENAI_MODEL: gpt-4o-mini  # 기본값

      - name: Send mail (Gmail, 제목/요약 한 줄에 출신 회사·선임 회사 반영)
        run: python send_email_from_json.py
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REQUEST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'today' || 'scheduled' }}
          APPLY_RECENT_DEDUPE: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}

      - name: Save sent_dedup_store for next run
        run: |
          mkdir -p .cache_dedup
          [ -f sent_dedup_store.json ] && cp sent_dedup_store.json .cache_dedup/ || true

      - name: Pull latest (monthly archive 등)
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Archive daily summary to monthly
        run: python archive_monthly_items.py

      - name: Commit and push monthly archive (저장소에 반영해 Monthly에서 동일 데이터 사용)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .monthly_archives/
          git diff --staged --quiet || (git commit -m "chore: update monthly archive $(TZ=Asia/Seoul date +%Y-%m)" && git push origin HEAD:${{ github.ref_name }})
