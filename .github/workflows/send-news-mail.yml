# 1시간마다 발송 (KST 09:05~19:05, 11회) — 직전 1시간 구간 기사만 포함
# 푸시 즉시 적용: 당일 남은 회차부터 스케줄 실행 (다음날부터 아님)
# 필수 Secrets: GMAIL_APP_PASSWORD, NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, OPENAI_API_KEY

name: Send News Mail

on:
  schedule:
    # KST 9시~19시 매시 5분 (정각 부하 회피). UTC: 0~10시 5분. 푸시 후 당일 남은 시각부터 실행
    - cron: '5 0 * * *'
    - cron: '5 1 * * *'
    - cron: '5 2 * * *'
    - cron: '5 3 * * *'
    - cron: '5 4 * * *'
    - cron: '5 5 * * *'
    - cron: '5 6 * * *'
    - cron: '5 7 * * *'
    - cron: '5 8 * * *'
    - cron: '5 9 * * *'
    - cron: '5 10 * * *'
  # 수시 발송: "Run workflow" 클릭 → 당일 00:00 KST~요청 시각 기사로 메일 발송
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_TO: ${{ secrets.GMAIL_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv

      - name: Restore sent_dedup_store (이전 메일 중복 제거용)
        uses: actions/cache@v4
        with:
          path: .cache_dedup
          key: sent-dedup-store-v1

      - name: Apply restored sent_dedup_store
        run: |
          mkdir -p .cache_dedup
          [ -f .cache_dedup/sent_dedup_store.json ] && cp .cache_dedup/sent_dedup_store.json . || true

      - name: Collect news (Naver API)
        run: python send_exec_news_timed.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TZ: Asia/Seoul
          FETCH_ARTICLE_BODY: "1"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REQUEST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'today' || 'scheduled' }}

      - name: Summarize with LLM
        run: python summarize_exec_news_llm.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OPENAI_MODEL: gpt-4o-mini  # 기본값

      - name: Send mail (Gmail)
        run: python send_email_from_json.py
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REQUEST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'today' || 'scheduled' }}
          APPLY_RECENT_DEDUPE: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}

      - name: Save sent_dedup_store for next run
        run: |
          mkdir -p .cache_dedup
          [ -f sent_dedup_store.json ] && cp sent_dedup_store.json .cache_dedup/ || true

      - name: Pull latest (monthly archive 등)
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Archive daily summary to monthly
        run: python archive_monthly_items.py

      - name: Commit and push monthly archive (저장소에 반영해 Monthly에서 동일 데이터 사용)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .monthly_archives/
          git diff --staged --quiet || (git commit -m "chore: update monthly archive $(TZ=Asia/Seoul date +%Y-%m)" && git push origin HEAD:${{ github.ref_name }})
